name: GoCrawl CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------
  # 1. BUILD & TEST JAVA CRAWLER ENGINE
  # -----------------------------------------------------------
  build-java:
    name: Build & Test Java Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Compile Java Code & Package Executable JAR
        run: |
          mkdir -p target/classes
          javac -encoding UTF-8 -cp "lib/jsoup-1.18.3.jar" -d target/classes $(find src/main/java -name "*.java")
          cd target/classes
          jar -xf ../../lib/jsoup-1.18.3.jar
          cd ../..
          jar --create --file gocrawl.jar --main-class id.gocrawl.Main -C target/classes .

      - name: Smoke Test Executable JAR
        run: |
          java -jar gocrawl.jar --help

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gocrawl-executable-jar
          path: gocrawl.jar
          retention-days: 14

  # -----------------------------------------------------------
  # 2. VALIDATE NODE.JS WEB DASHBOARD
  # -----------------------------------------------------------
  test-web:
    name: Validate Web Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify JavaScript Syntax
        run: |
          node --check web/server.mjs
          node --check web/public/app.js

      - name: Verify Static Frontend Assets
        run: |
          test -f web/public/index.html
          test -f web/public/styles.css
          test -f web/public/app.js

  # -----------------------------------------------------------
  # 3. AUTOMATIC GITHUB RELEASE (Triggered on git tag v*)
  # -----------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [build-java, test-web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Built JAR
        uses: actions/download-artifact@v4
        with:
          name: gocrawl-executable-jar

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: gocrawl.jar
          generate_release_notes: true

  # -----------------------------------------------------------
  # 4. DEPLOY TO VPS (Triggered on push to main branch)
  # -----------------------------------------------------------
  deploy:
    name: Deploy to VPS Server
    needs: [build-java, test-web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Verify Tailscale Connection
        run: |
          tailscale status
          nc -zv ${{ secrets.VPS_HOST }} ${{ secrets.VPS_PORT || 22 }} -w 10

      - name: Deploy via SSH
        timeout-minutes: 3
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          ssh_key="$(mktemp)"
          trap 'rm -f "$ssh_key"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_key"
          chmod 600 "$ssh_key"
          timeout 120s ssh \
            -i "$ssh_key" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE_SCRIPT'
          set -euo pipefail
          echo "SSH remote script started"
          export PATH="/usr/local/nvm/versions/node/v24.14.0/bin:$PATH"

          DEPLOY_DIR="$HOME/projects/gocrawl"
          mkdir -p "$HOME/projects"

          if [ ! -d "$DEPLOY_DIR" ] && [ -d "/var/www/gocrawl" ]; then
            echo "Migrating /var/www/gocrawl to $DEPLOY_DIR..."
            mv /var/www/gocrawl "$DEPLOY_DIR"
          elif [ ! -d "$DEPLOY_DIR" ]; then
            echo "Cloning repository to $DEPLOY_DIR..."
            git clone https://github.com/RosyidAl/GoCrawl.git "$DEPLOY_DIR"
          fi

          cd "$DEPLOY_DIR"
          echo "Pulling latest main..."
          GIT_TERMINAL_PROMPT=0 git pull --ff-only origin main

          if [ -f "./build.sh" ]; then
            chmod +x build.sh
            ./build.sh
          fi

          echo "Restarting GoCrawl web..."
          if pm2 describe gocrawl-web > /dev/null 2>&1; then
            pm2 restart gocrawl-web --update-env
          else
            pm2 start web/server.mjs --name "gocrawl-web"
          fi
          pm2 save

          echo "Deployment to VPS completed successfully via Tailscale!"
          REMOTE_SCRIPT
